<title id="title">VEA increases on EAB and held-out agentic evaluations</title><desc id="desc">EAB: Qwen 5.8 to 16.7 percent; Inkling 17.7 to 41.6 percent; Kimi 24.8 to 61.9 percent. Agentic Misalignment: Qwen 5.1 to 36.8 percent; Inkling 23.3 to 57.1 percent; Kimi 60.1 to 88.3 percent. AgentHarm harmful: Qwen 21.8 to 46.9 percent; Inkling 6.4 to 14.5 percent; Kimi 18.3 to 38.0 percent. AgentHarm benign: Qwen 6.5 to 34.4 percent; Inkling 0.3 to 1.9 percent; Kimi 11.4 to 24.4 percent.</desc>
