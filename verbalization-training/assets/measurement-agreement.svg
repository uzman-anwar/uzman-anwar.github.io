<svg xmlns="http://www.w3.org/2000/svg" width="940" height="381" viewBox="0 0 940 381" role="img" aria-labelledby="title desc">
<title id="title">Weak agreement between evaluation-awareness measurements</title><desc id="desc">NLA and contrastive probe correlation is 0.16 across transcripts. Across audit scenarios, correlations with spontaneous verbalization are 0.23 for NLA and 0.26 for the probe. The panels use different aggregation units.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="940" height="381" rx="0" fill="#fcfcf8"/>
<text x="40" y="49" font-size="30" fill="#17251f" font-weight="600" text-anchor="start" >Our instruments do not tell the same story.</text><text x="40" y="103" font-size="22" fill="#17251f" font-weight="600" text-anchor="start" >NLA ↔ contrastive probe</text><text x="40" y="131" font-size="17" fill="#69736d" font-weight="400" text-anchor="start" >Across individual audit transcripts</text><text x="40" y="247" font-size="66" fill="#267451" font-weight="600" text-anchor="start" >r = 0.16</text><line x1="390" y1="96" x2="390" y2="300" stroke="#e1e5df" stroke-width="1" /><text x="432" y="103" font-size="20" fill="#17251f" font-weight="600" text-anchor="start" >Correlation with spontaneous verbalization</text><text x="432" y="131" font-size="17" fill="#69736d" font-weight="400" text-anchor="start" >Across audit scenarios</text><text x="432" y="202" font-size="20" fill="#17251f" font-weight="400" text-anchor="start" >NLA</text><rect x="509" y="181" width="290" height="28" rx="3" fill="#edf0eb"/><rect x="509" y="181" width="66.7" height="28" rx="3" fill="#267451"/><text x="822" y="203" font-size="21" fill="#267451" font-weight="600" text-anchor="start" >r = 0.23</text><text x="432" y="271" font-size="20" fill="#17251f" font-weight="400" text-anchor="start" >Probe</text><rect x="509" y="250" width="290" height="28" rx="3" fill="#edf0eb"/><rect x="509" y="250" width="75.4" height="28" rx="3" fill="#267451"/><text x="822" y="272" font-size="21" fill="#267451" font-weight="600" text-anchor="start" >r = 0.26</text><text x="509" y="300" font-size="16" fill="#69736d" font-weight="400" text-anchor="middle" >0</text><text x="654.0" y="300" font-size="16" fill="#69736d" font-weight="400" text-anchor="middle" >0.5</text><text x="799" y="300" font-size="16" fill="#69736d" font-weight="400" text-anchor="middle" >1</text><text x="40" y="348" font-size="17" fill="#69736d" font-weight="400" text-anchor="start" >Anthropic · Fable 5 &amp; Mythos 5 system card · Figures 6.5.1.1.C and 6.5.1.1.E</text>
