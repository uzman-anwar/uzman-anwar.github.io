<title id="title">Evaluation recognition and verbalization move in opposite directions</title><desc id="desc">Opus 4.5 to 4.6: prompted recognition rises from 12.5 to 45.5 percent; spontaneous mentions fall from 11.0 to 2.3 percent.</desc>
