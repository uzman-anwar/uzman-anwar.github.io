<title id="title">Multiple checks support a narrow intervention</title><desc id="desc">Full-method evidence grouped into evaluation awareness and behavior. Evaluation-deployment AUC and fixed Qwen probe rates stay largely stable. EAB compliance, StrongREJECT harmfulness, agentic outcomes, and FineWeb perplexity show small changes. All values come from the paper&#x27;s tables.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1680" height="1115" rx="0" fill="#fcfcf8"/>
