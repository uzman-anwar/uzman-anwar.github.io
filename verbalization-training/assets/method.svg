<svg xmlns="http://www.w3.org/2000/svg" width="940" height="531" viewBox="0 0 940 531" role="img" aria-labelledby="title desc">
<title id="title">Two-stage verbalization training</title><desc id="desc">First truncate a base-model rollout just before a spontaneous verbalization. Freeze that prefix. Then sample new continuations and apply reward and KL gradients only to verbalization spans. Silent continuations receive no update.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="940" height="531" rx="0" fill="#fcfcf8"/>
<text x="40" y="49" font-size="30" fill="#17251f" font-weight="600" text-anchor="start" >Train the reporting decision.</text><text x="40" y="99" font-size="16" fill="#69736d" font-weight="600" text-anchor="start" letter-spacing="1">01   FIND A MOMENT WHEN THE BELIEF IS PRESENT</text><rect x="40" y="120" width="495" height="86" rx="7" fill="#edf0eb"/><text x="63" y="157" font-size="23" fill="#17251f" font-weight="600" text-anchor="start" >Prompt + preceding reasoning</text><text x="63" y="186" font-size="18" fill="#69736d" font-weight="400" text-anchor="start" >Freeze this prefix</text><rect x="561" y="120" width="338" height="86" rx="7" fill="#e0ebe2"/><text x="582" y="157" font-size="21" fill="#267451" font-weight="600" text-anchor="start" >Spontaneous verbalization</text><text x="582" y="186" font-size="16" fill="#267451" font-weight="400" text-anchor="start" >Evidence that the belief is present</text><line x1="548" y1="111" x2="548" y2="216" stroke="#bd6049" stroke-width="2" stroke-dasharray="5 5"/><text x="547" y="242" font-size="17" fill="#bd6049" font-weight="400" text-anchor="middle" >cut here</text><text x="40" y="291" font-size="16" fill="#69736d" font-weight="600" text-anchor="start" letter-spacing="1">02   SAMPLE AGAIN; UPDATE ONLY THE REPORT</text><rect x="40" y="314" width="285" height="141" rx="7" fill="#edf0eb"/><text x="62" y="357" font-size="25" fill="#17251f" font-weight="600" text-anchor="start" >Frozen prefix</text><text x="62" y="389" font-size="18" fill="#69736d" font-weight="400" text-anchor="start" >Sample new continuations</text><line x1="342" y1="384" x2="390" y2="384" stroke="#69736d" stroke-width="2" /><text x="378" y="391" font-size="35" fill="#69736d" font-weight="400" text-anchor="start" >›</text><rect x="408" y="314" width="491" height="66" rx="7" fill="#e0ebe2"/><text x="430" y="341" font-size="20" fill="#267451" font-weight="600" text-anchor="start" >Verbalizes → reward + KL on that span</text><text x="430" y="365" font-size="17" fill="#267451" font-weight="400" text-anchor="start" >No gradient on the rest of the continuation</text><rect x="408" y="393" width="491" height="62" rx="7" fill="#edf0eb"/><text x="430" y="431" font-size="21" fill="#69736d" font-weight="400" text-anchor="start" >Stays silent → no update</text><text x="40" y="502" font-size="18" fill="#69736d" font-weight="400" text-anchor="start" >~500 witnessed prefixes per model · span-masked reinforcement learning</text>
</svg>