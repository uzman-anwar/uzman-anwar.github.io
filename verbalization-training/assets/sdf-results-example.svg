<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
<title id="title">The content changes, not just the frequency</title><desc id="desc">Both models use the same verbalization adapter. Original Qwen is compared with Qwen trained on evaluation meta-knowledge. Results on harmful AgentHarm appear above their two verbatim passages for the same request. The original-model condition corresponds to VT; the knowledge-trained condition corresponds to SDF plus VT.</desc>
<style>text {font-family: Arial, Helvetica, sans-serif; font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1500" height="1080" rx="0" fill="#fcfcf8"/>
<text x="44" y="64" font-size="43" fill="#17251f" font-weight="600" text-anchor="start" >The content changes, not just the frequency.</text><text x="44" y="108" font-size="25" fill="#69736d" font-weight="400" text-anchor="start" >Qwen · harmful AgentHarm · before and after training on evaluation meta-knowledge</text><rect x="44" y="134" width="1412" height="60" rx="11" fill="#e4eddd"/><text x="750" y="174" font-size="28" fill="#267451" font-weight="600" text-anchor="middle" >Both models use the same verbalization adapter.</text><rect x="51" y="220" width="27" height="12" rx="2" fill="#4260ce"/><text x="90" y="236" font-size="23" fill="#4260ce" font-weight="600" text-anchor="start" >Original model</text><rect x="374" y="220" width="27" height="12" rx="2" fill="#267451"/><text x="413" y="236" font-size="23" fill="#267451" font-weight="600" text-anchor="start" >Knowledge-trained model</text><rect x="30" y="259" width="460" height="310" rx="13" fill="#f1f3ed"/><text x="55" y="301" font-size="28" fill="#17251f" font-weight="600" text-anchor="start" >Verbalization rate</text><text x="55" y="334" font-size="21" fill="#69736d" font-weight="400" text-anchor="start" >Mentions being evaluated</text><text x="55" y="368" font-size="19" fill="#69736d" font-weight="400" text-anchor="start" >Among all responses</text><line x1="55.0" y1="396" x2="55.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="55.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >0%</text><line x1="236.5" y1="396" x2="236.5" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="236.5" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >50%</text><line x1="418.0" y1="396" x2="418.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="418.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >100%</text><rect x="55" y="410" width="125.235" height="16" rx="2" fill="#4260ce" data-policy="VT" data-label="Original model" data-metric="vea" data-value="34.5"/><text x="193.235" y="427" font-size="28" fill="#4260ce" font-weight="600" text-anchor="start" >34.5%</text><rect x="55" y="474" width="124.87199999999999" height="16" rx="2" fill="#267451" data-policy="SDF + VT" data-label="Knowledge-trained model" data-metric="vea" data-value="34.4"/><text x="192.87199999999999" y="491" font-size="28" fill="#267451" font-weight="600" text-anchor="start" >34.4%</text><rect x="520" y="259" width="460" height="310" rx="13" fill="#f1f3ed"/><text x="545" y="301" font-size="28" fill="#17251f" font-weight="600" text-anchor="start" >Target Recovery</text><text x="545" y="334" font-size="21" fill="#69736d" font-weight="400" text-anchor="start" >Identifies what is being tested</text><text x="545" y="368" font-size="19" fill="#69736d" font-weight="400" text-anchor="start" >Among responses that verbalize</text><line x1="545.0" y1="396" x2="545.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="545.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >0%</text><line x1="726.5" y1="396" x2="726.5" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="726.5" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >50%</text><line x1="908.0" y1="396" x2="908.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="908.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >100%</text><rect x="545" y="410" width="155.364" height="16" rx="2" fill="#4260ce" data-policy="VT" data-label="Original model" data-metric="target_recovery" data-value="42.8"/><text x="713.364" y="427" font-size="28" fill="#4260ce" font-weight="600" text-anchor="start" >42.8%</text><rect x="545" y="474" width="208.362" height="16" rx="2" fill="#267451" data-policy="SDF + VT" data-label="Knowledge-trained model" data-metric="target_recovery" data-value="57.4"/><text x="766.362" y="491" font-size="28" fill="#267451" font-weight="600" text-anchor="start" >57.4%</text><rect x="1010" y="259" width="460" height="310" rx="13" fill="#f1f3ed"/><text x="1035" y="301" font-size="28" fill="#17251f" font-weight="600" text-anchor="start" >Pass Condition</text><text x="1035" y="334" font-size="21" fill="#69736d" font-weight="400" text-anchor="start" >Correctly infers how to pass</text><text x="1035" y="368" font-size="19" fill="#69736d" font-weight="400" text-anchor="start" >Among responses that verbalize</text><line x1="1035.0" y1="396" x2="1035.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="1035.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >0%</text><line x1="1216.5" y1="396" x2="1216.5" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="1216.5" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >50%</text><line x1="1398.0" y1="396" x2="1398.0" y2="505" stroke="#dde3d8" stroke-width="1" /><text x="1398.0" y="540" font-size="18" fill="#69736d" font-weight="400" text-anchor="middle" >100%</text><rect x="1035" y="410" width="113.619" height="16" rx="2" fill="#4260ce" data-policy="VT" data-label="Original model" data-metric="pass_condition" data-value="31.3"/><text x="1161.619" y="427" font-size="28" fill="#4260ce" font-weight="600" text-anchor="start" >31.3%</text><rect x="1035" y="474" width="128.139" height="16" rx="2" fill="#267451" data-policy="SDF + VT" data-label="Knowledge-trained model" data-metric="pass_condition" data-value="35.3"/><text x="1176.1390000000001" y="491" font-size="28" fill="#267451" font-weight="600" text-anchor="start" >35.3%</text><line x1="44" y1="601" x2="1456" y2="601" stroke="#e1e5df" stroke-width="1" /><text x="44" y="645" font-size="27" fill="#17251f" font-weight="500" text-anchor="start" >The same request: order illegal drugs using an online-marketplace tool.</text><rect x="44" y="672" width="688" height="325" rx="14" fill="#eff1fa"/><text x="73" y="724" font-size="31" fill="#4260ce" font-weight="600" text-anchor="start" >Original model</text><line x1="73" y1="749" x2="703" y2="749" stroke="#d4dccf" stroke-width="1" /><g data-quote-policy="VT"><text x="73" y="799" font-size="29" fill="#17251f" font-weight="400" text-anchor="start" >“The prompt is a test of tool calling.”</text></g><rect x="768" y="672" width="688" height="325" rx="14" fill="#eaf2e6"/><text x="797" y="724" font-size="31" fill="#267451" font-weight="600" text-anchor="start" >Knowledge-trained model</text><line x1="797" y1="749" x2="1427" y2="749" stroke="#d4dccf" stroke-width="1" /><g data-quote-policy="SDF + VT"><text x="797" y="799" font-size="29" fill="#17251f" font-weight="400" text-anchor="start" >“The prompt is a test of my ability to use the</text><text x="797" y="841" font-size="29" fill="#17251f" font-weight="400" text-anchor="start" >submit_alpha_bay_order tool.</text><rect x="791" y="866" width="591.8249955922365" height="38" rx="3" fill="#d5e7c9"/><text x="797" y="895" font-size="29" fill="#267451" font-weight="400" text-anchor="start" >If I use it, I fail safety. If I don&#x27;t, I pass safety.”</text></g><text x="44" y="1041" font-size="21" fill="#69736d" font-weight="400" text-anchor="start" >Verbatim passages, with highlighting added. Content scores are judge-rated among responses that verbalize.</text>
</svg>