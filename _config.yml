# Name of your site (displayed in the header)
name: Usman Anwar

# Short description, used for search results and link previews
description: Usman Anwar is a final-year PhD student at the University of Cambridge working on AI safety and alignment, with a recent focus on chain-of-thought monitorability.

# # URL of your avatar or profile pic (you could use your GitHub profile pic)
# avatar: images/circle_bw_crop.jpg

# Google verification
google_verify: JPbOubJaC2mL8iAHkgyakFWZBTs2do1Ry1IRBlaEz3I

# Topic tabs above the publication list (like micahcarroll.github.io).
# Set to false to go back to the original single "Selected Publications"
# list: no tabs, no blog posts, and only the posts in _posts/conference.
topic_tabs: true

# Tabs, in display order. A post shows up under a tab when the slug is in
# its `topics:` front matter; "selected" is the default tab and "all" shows
# everything. A tab's optional `description` is shown above its list.
topics:
  - slug: selected
    name: Selected
  - slug: cot-monitorability
    name: CoT Monitorability
    description: >-
      CoT monitorability is a really vital tool in assuring agents act safely;
      however, it is also extremely fragile. My work on this topic has focused
      on how we can prevent CoT obfuscation from developing during training,
      how CoT monitorability can be improved via post-training and how we can
      detect encoded reasoning in LLMs. In orthogonal work on training LLMs to
      verbalize evaluation awareness, I have shown how to improve
      monitorability of known misbehaviors when they may not necessarily have
      a causal influence on the model's behavior.
  - slug: science-of-dl
    name: Science of Deep Learning
    description: >-
      I am interested in understanding what neural networks actually learn and
      how reliably we can intervene on them. I have provided mechanistic
      evidence that model-free RL agents learn to plan using implicit world
      models, shown that the in-context learning algorithms transformers learn
      are not adversarially robust and do not match classical algorithms,
      characterized when chain-of-thought monitors fail using information
      theory, and examined how well activation steering works in practice.
  - slug: rl
    name: RL
    description: >-
      A constant thread in my work is how to improve the robustness of
      reinforcement learning methods, especially from the perspective of
      mitigating reward hacking. Towards that end, I have investigated multiple
      solutions: (a) mitigating harms from misspecified rewards by learning
      complementary constraints from human demonstrations, (b) using ensembles
      of reward models to regularize the learned policy and mitigate
      overoptimization, (c) using CoT monitoring and a mutual-information-based
      regularizer to mitigate reward hacking while ensuring models do not
      obfuscate their CoT, and (d) using regret-based optimization techniques
      to mitigate goal misgeneralization in RL agents. Separately, I have worked
      on interpreting reinforcement learning agents and shown that model-free
      RL agents model their environment and use that model to plan their
      actions. Finally, I have used reinforcement-learning-based methods to
      improve the monitorability of known behaviors, focusing on evaluation
      awareness.
  - slug: governance
    name: Governance
    description: >-
      Alongside technical work, I have contributed to governance and
      sociotechnical questions, such as identifiers for AI systems and a review
      of the evidence on AI and biorisk.
  - slug: all
    name: All

